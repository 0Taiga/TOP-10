<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="dashboard">

    <!-- TOPO -->
    <div class="topbar">
      <img src="img/involves.png" class="logo-left">
      <img src="img/focomixalimentar.png" class="logo-right">
    </div>

    <!-- CONTEÚDO -->
    <div class="container">

      <!-- SIDEBAR -->
      <div class="sidebar">
        <div class="box-interna"></div>
      </div>

      <!-- MAIN -->
      <div class="main">

        <!-- KPIs -->
        <div class="kpis">
          <div class="card kpi"></div>
          <div class="card kpi"></div>
          <div class="card kpi"></div>
          <div class="card kpi"></div>
        </div>

        <!-- LINHA 1 -->
        <div class="linha-2">
          <div class="card grande"></div>

          <div class="card alto"></div>
        </div>

        <!-- LINHA 2 -->
        <div class="linha-2">
          <div class="card grande"></div>

          <div class="card alto"></div>
        </div>

        <!-- LINHA 3 -->
        <div class="linha-2">
          <div class="card grande"></div>

          <div class="card alto"></div>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
