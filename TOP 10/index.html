<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top 10 Vendedores</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrapper">

  <div class="dashboard">

    <!-- TOPO -->
    <div class="topbar">
      <img src="img/involves.png" class="logo-left">
      <img src="img/focomix.png" class="logo-right">
    </div>

    <!-- KPIs -->
    <div class="kpis">
      <div class="card kpi">
        <p>Média Geral de Cumprimento</p>
      </div>

      <div class="card kpi">
        <p>Melhor Vendedor</p>
        <div class="container"></div>
      </div>

      <div class="card kpi">
        <p>Menor Desempenho</p>
      </div>
    </div>

    <!-- GRID PRINCIPAL -->
    <div class="content">

      <!-- MELHORES -->
      <div class="card grande">
        <h3 class="green">Top 10 - Melhores Cumprimentos</h3>
        <div class="box-interno"></div>
      </div>

      <!-- PIORES -->
      <div class="card grande">
        <h3 class="red">Top 10 - Menores Cumprimentos</h3>
        <div class="box-interno"></div>
      </div>

      <!-- EXTRA -->
      <div class="card">
        <h3>Distribuição</h3>
      </div>

      <div class="card">
        <h3>Evolução</h3>
      </div>

    </div>

  </div>

</div>

</body>
</html>
